<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOGGADE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="game"></div>

  <div id="hud" class="hidden">
    <div id="vignette"></div>
    <div id="dmg-indicators"></div>
    <div id="crosshair"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="c"></i></div>
    <div id="hitmarker"></div>
    <div id="dmg-numbers"></div>
    <div id="xp-feed"></div>
    <div id="buff" class="hidden"></div>
    <div id="scope" class="hidden"></div>
    <div id="topbar"><div id="timer"></div><div id="my-score"></div><div id="leader"></div></div>
    <div id="killfeed"></div>
    <div id="center-msg"></div>
    <div id="protect" class="hidden">SPAWNSKYDD</div>
    <div id="health">
      <div class="label">HÄLSA</div>
      <div id="hp-num">100</div>
      <div class="bar"><div id="hp-bar"></div></div>
    </div>
    <div id="ammo">
      <div id="weapon-name"></div>
      <div><span id="ammo-num">30</span><span class="sep">/</span><span class="inf">∞</span></div>
      <div id="reload-hint"></div>
    </div>
    <div id="ability"><div id="ability-fill"></div><kbd>E</kbd><div id="ability-name"></div><div id="ability-cd"></div></div>
    <div id="ping"></div>
    <div id="practice-stats"></div>
  </div>

  <div id="death" class="hidden">
    <div class="title">ELIMINERAD</div>
    <div id="death-by"></div>
    <div id="death-timer"></div>
    <div id="death-weapon"></div>
    <div class="hint">Tryck 1–6 för att byta gubbe</div>
  </div>

  <div id="roundend" class="hidden">
    <div class="title" id="re-title"></div>
    <div id="re-next"></div>
    <div id="re-xp"></div>
    <div id="re-timer"></div>
  </div>

  <div id="scoreboard" class="hidden">
    <div class="sb-head"><span id="sb-mode">FREE FOR ALL</span><span id="sb-limit"></span></div>
    <table>
      <thead><tr><th>#</th><th>Spelare</th><th>Gubbe</th><th>Kills</th><th>Döda</th><th>K/D</th><th>Ping</th></tr></thead>
      <tbody id="sb-body"></tbody>
    </table>
  </div>

  <div id="menu">
    <div class="panel">
      <h1>MOGGADE</h1>
      <div class="sub">FFA · GUN GAME · ARENA <span id="version"></span></div>
      <div id="profile"></div>
      <label class="field">
        <span>Namn</span>
        <input id="name" maxlength="16" placeholder="Ditt namn" autocomplete="off">
      </label>
      <div class="field">
        <span>Färg</span>
        <div id="colors"></div>
      </div>
      <label class="field">
        <span>Känslighet <em id="sens-val"></em></span>
        <input type="range" id="sens" min="0.2" max="3" step="0.05">
      </label>
      <label class="field">
        <span>Volym</span>
        <input type="range" id="vol" min="0" max="1" step="0.05">
      </label>
      <button id="play">FREE FOR ALL</button>
      <button id="play-gg">GUN GAME</button>
      <button id="practice">ÖVNING</button>
      <div id="status"></div>
      <div id="weapon-note"></div>
      <div class="controls">
        <div><kbd>WASD</kbd> gå</div><div><kbd>SHIFT</kbd> spring</div>
        <div><kbd>SPACE</kbd> hoppa</div><div><kbd>R</kbd> ladda om</div>
        <div><kbd>VÄNSTER</kbd> skjut</div><div><kbd>HÖGER</kbd> sikta</div>
        <div><kbd>CTRL</kbd> glid</div><div><kbd>E</kbd> förmåga</div>
        <div><kbd>TAB</kbd> poäng</div><div><kbd>ESC</kbd> meny</div>
      </div>
    </div>
    <div class="panel weapons-panel">
      <div class="field"><span>Välj gubbe</span></div>
      <div id="weapons"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
